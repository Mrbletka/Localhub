<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tower Defense v0.1.0</title>
  <style>
    :root {
      --bg: #13161d;
      --panel: #1d2230;
      --panel-2: #262c3b;
      --border: #333b4f;
      --text: #e8ecf4;
      --muted: #8a93a8;
      --accent: #f5b942;
      --good: #5fd38d;
      --bad: #ef5b5b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
    }

    .game {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      letter-spacing: 0.01em;
    }

    .version {
      margin-left: 6px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
    }

    .hud {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-variant-numeric: tabular-nums;
    }

    .stat span {
      margin-right: 6px;
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat.gold b { color: var(--accent); }
    .stat.lives b { color: var(--bad); }

    .board { position: relative; }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #3f6b3a;
      touch-action: none;
      user-select: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      border-radius: 10px;
      background: rgba(10, 12, 18, 0.78);
      text-align: center;
    }

    .overlay.show { display: flex; }
    .overlay h2 { margin: 0; font-size: 1.8rem; color: var(--bad); }
    .overlay p { margin: 0 0 6px; color: var(--muted); }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .shop {
      display: flex;
      gap: 8px;
      flex: 1 1 440px;
      flex-wrap: wrap;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: stretch;
    }

    button {
      font: inherit;
      color: inherit;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }

    button:hover:not(:disabled) { border-color: var(--accent); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #1b1b1b;
      font-weight: 600;
    }

    button.primary:hover:not(:disabled) { background: #ffcb5c; }

    .tower-btn {
      flex: 1 1 130px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      column-gap: 8px;
      row-gap: 2px;
      align-items: center;
      text-align: left;
    }

    .tower-btn.selected {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
      background: #2f3546;
    }

    .tower-btn .swatch {
      grid-row: 1 / span 2;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.35);
    }

    .tower-btn .name { font-weight: 600; }
    .tower-btn .cost { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
    .tower-btn.poor .cost { color: var(--bad); }
    .tower-btn .desc { grid-column: 2 / span 2; color: var(--muted); font-size: 0.78rem; }

    kbd {
      margin-left: 4px;
      padding: 0 4px;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      font: 0.7rem ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .info {
      min-height: 50px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .info .muted { color: var(--muted); }

    .help {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="game">
    <header class="top">
      <h1>Tower Defense<span class="version" id="version"></span></h1>
      <div class="hud">
        <div class="stat gold"><span>Gold</span><b id="gold">0</b></div>
        <div class="stat lives"><span>Lives</span><b id="lives">0</b></div>
        <div class="stat"><span>Wave</span><b id="wave">0</b></div>
        <div class="stat"><span>Enemies</span><b id="enemies">0</b></div>
      </div>
    </header>

    <div class="board">
      <canvas id="game" aria-label="Tower defense game board"></canvas>
      <div class="overlay" id="overlay">
        <h2>Game Over</h2>
        <p id="overlay-text"></p>
        <button class="primary" id="restart">Play again</button>
      </div>
    </div>

    <div class="controls">
      <div class="shop" id="shop"></div>
      <div class="actions">
        <button id="speed">Speed 1×</button>
        <button id="pause">Pause</button>
        <button class="primary" id="start">Start Wave 1</button>
      </div>
    </div>

    <div class="info" id="info"></div>

    <p class="help">
      Keys: <kbd>1</kbd>–<kbd>3</kbd> pick tower · <kbd>Space</kbd> start wave · <kbd>P</kbd> pause ·
      <kbd>F</kbd> speed · <kbd>Del</kbd> sell selected · <kbd>Esc</kbd> / right-click cancel
    </p>
  </main>

  <script>
    (() => {
      'use strict';

      const VERSION = '0.1.0';

      // ---------- Config ----------
      const TILE = 40;
      const COLS = 20;
      const ROWS = 12;
      const W = COLS * TILE;
      const H = ROWS * TILE;
      const TAU = Math.PI * 2;

      const START_GOLD = 150;
      const START_LIVES = 20;
      const SELL_RATIO = 0.7;
      const SPEEDS = [1, 2, 3];

      const TOWERS = {
        arrow: {
          name: 'Arrow', key: '1', cost: 50, range: 110, rate: 0.45, damage: 12,
          projectileSpeed: 480, color: '#6fb3ff', barrel: [19, 4], desc: 'Fast, single target',
        },
        cannon: {
          name: 'Cannon', key: '2', cost: 90, range: 100, rate: 1.4, damage: 28, splash: 55,
          projectileSpeed: 280, color: '#f08a4b', barrel: [17, 9], desc: 'Slow, splash damage',
        },
        frost: {
          name: 'Frost', key: '3', cost: 70, range: 90, rate: 0.9, damage: 5, slow: 0.5, slowTime: 1.5,
          projectileSpeed: 380, color: '#8ee6f2', barrel: [15, 6], desc: 'Slows enemies',
        },
      };

      const ENEMIES = {
        grunt:  { hp: 40,  speed: 60,  reward: 6,  radius: 10, color: '#d9534f', lives: 1, gap: 0.8 },
        runner: { hp: 24,  speed: 100, reward: 5,  radius: 8,  color: '#f0d04b', lives: 1, gap: 0.5 },
        tank:   { hp: 150, speed: 38,  reward: 15, radius: 14, color: '#9b6bd6', lives: 2, gap: 1.3 },
      };

      // Path waypoints in tile coordinates. First and last sit just off the board.
      const PATH = [[-1, 2], [4, 2], [4, 8], [9, 8], [9, 3], [14, 3], [14, 9], [17, 9], [17, 5], [20, 5]];

      // ---------- Helpers ----------
      function inBounds(c, r) { return c >= 0 && c < COLS && r >= 0 && r < ROWS; }
      function tileKey(c, r) { return c + ',' + r; }
      function tileCenter(c, r) { return { x: (c + 0.5) * TILE, y: (r + 0.5) * TILE }; }
      function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

      function roundRect(g, x, y, w, h, r) {
        g.beginPath();
        g.moveTo(x + r, y);
        g.arcTo(x + w, y, x + w, y + h, r);
        g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r);
        g.arcTo(x, y, x + w, y, r);
        g.closePath();
      }

      // ---------- Path geometry ----------
      const waypoints = PATH.map(([c, r]) => tileCenter(c, r));
      const segLens = [];
      let pathLength = 0;
      for (let i = 0; i < waypoints.length - 1; i++) {
        const len = Math.hypot(waypoints[i + 1].x - waypoints[i].x, waypoints[i + 1].y - waypoints[i].y);
        segLens.push(len);
        pathLength += len;
      }

      const pathTiles = new Set();
      for (let i = 0; i < PATH.length - 1; i++) {
        let [c, r] = PATH[i];
        const [c1, r1] = PATH[i + 1];
        const dc = Math.sign(c1 - c);
        const dr = Math.sign(r1 - r);
        for (;;) {
          if (inBounds(c, r)) pathTiles.add(tileKey(c, r));
          if (c === c1 && r === r1) break;
          c += dc;
          r += dr;
        }
      }

      function pointAt(d) {
        for (let i = 0; i < segLens.length; i++) {
          if (d <= segLens[i]) {
            const a = waypoints[i];
            const b = waypoints[i + 1];
            const t = d / segLens[i];
            return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
          }
          d -= segLens[i];
        }
        return waypoints[waypoints.length - 1];
      }

      // ---------- DOM ----------
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = W * dpr;
      canvas.height = H * dpr;

      const el = {
        version: document.getElementById('version'),
        gold: document.getElementById('gold'),
        lives: document.getElementById('lives'),
        wave: document.getElementById('wave'),
        enemies: document.getElementById('enemies'),
        shop: document.getElementById('shop'),
        speed: document.getElementById('speed'),
        pause: document.getElementById('pause'),
        start: document.getElementById('start'),
        info: document.getElementById('info'),
        overlay: document.getElementById('overlay'),
        overlayText: document.getElementById('overlay-text'),
        restart: document.getElementById('restart'),
      };

      el.version.textContent = 'v' + VERSION;

      const shopButtons = {};
      for (const [type, def] of Object.entries(TOWERS)) {
        const btn = document.createElement('button');
        btn.className = 'tower-btn';
        btn.innerHTML =
          `<i class="swatch" style="background:${def.color}"></i>` +
          `<span class="name">${def.name}<kbd>${def.key}</kbd></span>` +
          `<span class="cost">${def.cost}g</span>` +
          `<span class="desc">${def.desc}</span>`;
        btn.addEventListener('click', () => selectBuildType(type));
        el.shop.appendChild(btn);
        shopButtons[type] = btn;
      }

      // ---------- Pre-rendered board ----------
      const boardCanvas = document.createElement('canvas');
      boardCanvas.width = W * dpr;
      boardCanvas.height = H * dpr;
      (function drawBoard() {
        const g = boardCanvas.getContext('2d');
        g.scale(dpr, dpr);

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            g.fillStyle = (r + c) % 2 ? '#3f6b3a' : '#44733f';
            g.fillRect(c * TILE, r * TILE, TILE, TILE);
          }
        }

        // Grass tufts from a tiny seeded RNG so the board looks the same every load.
        let seed = 1337;
        const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
        g.fillStyle = 'rgba(255, 255, 255, 0.06)';
        for (let i = 0; i < 260; i++) {
          g.fillRect(rand() * W, rand() * H, 2, 2);
        }

        g.lineJoin = 'miter';
        g.lineCap = 'butt';
        g.beginPath();
        g.moveTo(waypoints[0].x, waypoints[0].y);
        for (let i = 1; i < waypoints.length; i++) g.lineTo(waypoints[i].x, waypoints[i].y);
        g.strokeStyle = '#6e5635';
        g.lineWidth = TILE + 4;
        g.stroke();
        g.strokeStyle = '#c8a468';
        g.lineWidth = TILE - 6;
        g.stroke();

        // Entry and exit markers.
        const [, entryRow] = PATH[0];
        const [, exitRow] = PATH[PATH.length - 1];
        g.fillStyle = '#5fd38d';
        g.fillRect(0, entryRow * TILE + 3, 5, TILE - 6);
        g.fillStyle = '#ef5b5b';
        g.fillRect(W - 5, exitRow * TILE + 3, 5, TILE - 6);
      })();

      // ---------- State ----------
      let state;

      function newGame() {
        state = {
          gold: START_GOLD,
          lives: START_LIVES,
          wave: 0,
          towers: [],
          enemies: [],
          projectiles: [],
          effects: [],
          spawnQueue: [],
          spawnTimer: 0,
          waveActive: false,
          speedIndex: 0,
          paused: false,
          over: false,
          buildType: null,
          selectedTower: null,
          hover: null,
          banner: null,
        };
        el.overlay.classList.remove('show');
        renderInfo();
        updateShopSelection();
        updateHud();
      }

      function towerAt(c, r) {
        return state.towers.find((t) => t.c === c && t.r === r) || null;
      }

      function canBuildAt(c, r) {
        return inBounds(c, r) && !pathTiles.has(tileKey(c, r)) && !towerAt(c, r);
      }

      function sellValue(t) {
        return Math.floor(TOWERS[t.type].cost * SELL_RATIO);
      }

      function addText(x, y, text, color) {
        state.effects.push({ kind: 'text', x: clamp(x, 20, W - 20), y, text, color, t: 0, life: 1 });
      }

      function addRing(x, y, r0, r1, color, life = 0.35) {
        state.effects.push({ kind: 'ring', x, y, r0, r1, color, t: 0, life });
      }

      function showBanner(text) {
        state.banner = { text, t: 2.2 };
      }

      // ---------- Waves ----------
      function buildWave(n) {
        const groups = [['grunt', 5 + n * 2]];
        if (n >= 2) groups.push(['runner', Math.floor(n * 1.5)]);
        if (n >= 4) groups.push(['tank', Math.floor((n - 2) / 2)]);

        // Spread each enemy type evenly across the wave instead of sending them in blocks.
        const list = [];
        for (const [type, count] of groups) {
          for (let i = 0; i < count; i++) list.push({ type, order: (i + 0.5) / count });
        }
        list.sort((a, b) => a.order - b.order);
        return list.map((e) => e.type);
      }

      function startWave() {
        const s = state;
        if (s.over || s.waveActive) return;
        s.wave++;
        s.spawnQueue = buildWave(s.wave);
        s.spawnTimer = 0;
        s.waveActive = true;
        showBanner(`Wave ${s.wave}`);
        updateHud();
      }

      function spawnEnemy(type) {
        const def = ENEMIES[type];
        const hp = Math.round(def.hp * Math.pow(1.13, state.wave - 1));
        const start = waypoints[0];
        state.enemies.push({
          type,
          hp,
          maxHp: hp,
          speed: def.speed,
          radius: def.radius,
          reward: def.reward + Math.floor(state.wave / 5),
          dist: 0,
          x: start.x,
          y: start.y,
          slowTimer: 0,
          slowFactor: 1,
          dead: false,
        });
      }

      function waveCleared() {
        const s = state;
        s.waveActive = false;
        const bonus = 20 + s.wave * 5;
        s.gold += bonus;
        showBanner(`Wave ${s.wave} cleared! +${bonus} gold`);
      }

      function gameOver() {
        const s = state;
        s.over = true;
        s.lives = 0;
        s.buildType = null;
        s.selectedTower = null;
        el.overlayText.textContent =
          `The enemies broke through on wave ${s.wave}. You cleared ${Math.max(0, s.wave - 1)} wave${s.wave - 1 === 1 ? '' : 's'}.`;
        el.overlay.classList.add('show');
        renderInfo();
        updateShopSelection();
      }

      // ---------- Combat ----------
      function damageEnemy(e, amount) {
        if (e.dead) return;
        e.hp -= amount;
        if (e.hp <= 0) {
          e.dead = true;
          state.gold += e.reward;
          addRing(e.x, e.y, e.radius * 0.5, e.radius * 1.8, ENEMIES[e.type].color);
          addText(e.x, e.y - e.radius, `+${e.reward}`, '#f5b942');
        }
      }

      function findTarget(t, range) {
        let best = null;
        const r2 = range * range;
        for (const e of state.enemies) {
          if (e.dead) continue;
          const dx = e.x - t.x;
          const dy = e.y - t.y;
          // Target the enemy furthest along the path that is in range.
          if (dx * dx + dy * dy <= r2 && (!best || e.dist > best.dist)) best = e;
        }
        return best;
      }

      function fire(t, target) {
        const def = TOWERS[t.type];
        state.projectiles.push({
          type: t.type,
          x: t.x + Math.cos(t.angle) * def.barrel[0],
          y: t.y + Math.sin(t.angle) * def.barrel[0],
          tx: target.x,
          ty: target.y,
          target,
          done: false,
        });
      }

      function impact(p) {
        const def = TOWERS[p.type];
        if (def.splash) {
          for (const e of state.enemies) {
            if (!e.dead && Math.hypot(e.x - p.tx, e.y - p.ty) <= def.splash + e.radius) {
              damageEnemy(e, def.damage);
            }
          }
          addRing(p.tx, p.ty, 6, def.splash, 'rgba(240, 138, 75, 0.9)', 0.3);
          return;
        }
        const e = p.target;
        if (!e || e.dead) return;
        if (def.slow) {
          e.slowTimer = Math.max(e.slowTimer, def.slowTime);
          e.slowFactor = def.slow;
        }
        damageEnemy(e, def.damage);
      }

      // ---------- Update ----------
      function update(dt) {
        const s = state;

        if (s.waveActive && s.spawnQueue.length) {
          s.spawnTimer -= dt;
          if (s.spawnTimer <= 0) {
            const type = s.spawnQueue.shift();
            spawnEnemy(type);
            s.spawnTimer = ENEMIES[type].gap;
          }
        }

        const exit = waypoints[waypoints.length - 2];
        for (const e of s.enemies) {
          if (e.dead) continue;
          let speed = e.speed;
          if (e.slowTimer > 0) {
            e.slowTimer -= dt;
            speed *= e.slowFactor;
          }
          e.dist += speed * dt;
          if (e.dist >= pathLength) {
            e.dead = true;
            const lost = ENEMIES[e.type].lives;
            s.lives -= lost;
            addText(W - 24, exit.y - 14, `-${lost}`, '#ef5b5b');
            continue;
          }
          const p = pointAt(e.dist);
          e.x = p.x;
          e.y = p.y;
        }

        for (const t of s.towers) {
          const def = TOWERS[t.type];
          t.cooldown = Math.max(0, t.cooldown - dt);
          const target = findTarget(t, def.range);
          if (!target) continue;
          t.angle = Math.atan2(target.y - t.y, target.x - t.x);
          if (t.cooldown <= 0) {
            fire(t, target);
            t.cooldown = def.rate;
          }
        }

        for (const p of s.projectiles) {
          // Home in on the target; if it dies first, finish the flight to its last position.
          if (p.target && !p.target.dead) {
            p.tx = p.target.x;
            p.ty = p.target.y;
          }
          const dx = p.tx - p.x;
          const dy = p.ty - p.y;
          const d = Math.hypot(dx, dy);
          const step = TOWERS[p.type].projectileSpeed * dt;
          if (d <= step) {
            impact(p);
            p.done = true;
          } else {
            p.x += (dx / d) * step;
            p.y += (dy / d) * step;
          }
        }

        for (const fx of s.effects) fx.t += dt;

        s.enemies = s.enemies.filter((e) => !e.dead);
        s.projectiles = s.projectiles.filter((p) => !p.done);
        s.effects = s.effects.filter((fx) => fx.t < fx.life);

        if (s.banner) {
          s.banner.t -= dt;
          if (s.banner.t <= 0) s.banner = null;
        }

        if (s.lives <= 0) {
          gameOver();
          return;
        }

        if (s.waveActive && !s.spawnQueue.length && !s.enemies.length) waveCleared();
      }

      // ---------- Render ----------
      function drawRange(x, y, r, valid) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, TAU);
        ctx.fillStyle = valid ? 'rgba(255, 255, 255, 0.08)' : 'rgba(239, 91, 91, 0.1)';
        ctx.fill();
        ctx.strokeStyle = valid ? 'rgba(255, 255, 255, 0.45)' : 'rgba(239, 91, 91, 0.6)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      function drawTower(t, alpha = 1) {
        const def = TOWERS[t.type];
        ctx.globalAlpha = alpha;

        roundRect(ctx, t.x - 16, t.y - 16, 32, 32, 7);
        ctx.fillStyle = '#2b303b';
        ctx.fill();
        ctx.strokeStyle = '#161a22';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.rotate(t.angle);
        ctx.fillStyle = '#1a1e26';
        ctx.fillRect(0, -def.barrel[1] / 2, def.barrel[0], def.barrel[1]);
        ctx.restore();

        ctx.beginPath();
        ctx.arc(t.x, t.y, 10, 0, TAU);
        ctx.fillStyle = def.color;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(t.x - 3, t.y - 3, 3.5, 0, TAU);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.fill();

        ctx.globalAlpha = 1;
      }

      function drawEnemy(e) {
        const def = ENEMIES[e.type];

        ctx.beginPath();
        ctx.ellipse(e.x, e.y + e.radius * 0.75, e.radius, e.radius * 0.4, 0, 0, TAU);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, TAU);
        ctx.fillStyle = def.color;
        ctx.fill();
        const slowed = e.slowTimer > 0;
        ctx.strokeStyle = slowed ? '#8ee6f2' : 'rgba(0, 0, 0, 0.45)';
        ctx.lineWidth = slowed ? 3 : 2;
        ctx.stroke();

        if (e.hp < e.maxHp) {
          const w = e.radius * 2 + 6;
          const x = e.x - w / 2;
          const y = e.y - e.radius - 9;
          const ratio = Math.max(0, e.hp / e.maxHp);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
          ctx.fillRect(x - 1, y - 1, w + 2, 6);
          ctx.fillStyle = ratio > 0.5 ? '#5fd38d' : ratio > 0.25 ? '#f5b942' : '#ef5b5b';
          ctx.fillRect(x, y, w * ratio, 4);
        }
      }

      function render() {
        const s = state;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.drawImage(boardCanvas, 0, 0, W, H);

        if (s.selectedTower) {
          const t = s.selectedTower;
          drawRange(t.x, t.y, TOWERS[t.type].range, true);
          ctx.strokeStyle = '#f5b942';
          ctx.lineWidth = 2;
          ctx.strokeRect(t.c * TILE + 1, t.r * TILE + 1, TILE - 2, TILE - 2);
        }

        for (const t of s.towers) drawTower(t);

        if (s.hover && !s.over) {
          const { c, r } = s.hover;
          if (s.buildType) {
            const def = TOWERS[s.buildType];
            const spotOk = canBuildAt(c, r);
            const valid = spotOk && s.gold >= def.cost;
            const { x, y } = tileCenter(c, r);
            ctx.fillStyle = valid ? 'rgba(255, 255, 255, 0.15)' : 'rgba(239, 91, 91, 0.35)';
            ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
            drawRange(x, y, def.range, valid);
            if (spotOk) drawTower({ type: s.buildType, x, y, angle: -Math.PI / 2 }, 0.55);
          } else if (towerAt(c, r)) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(c * TILE + 1, r * TILE + 1, TILE - 2, TILE - 2);
          }
        }

        for (const e of s.enemies) drawEnemy(e);

        for (const p of s.projectiles) {
          const def = TOWERS[p.type];
          ctx.beginPath();
          ctx.arc(p.x, p.y, def.splash ? 5 : 3, 0, TAU);
          ctx.fillStyle = def.color;
          ctx.fill();
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (const fx of s.effects) {
          const k = fx.t / fx.life;
          ctx.globalAlpha = 1 - k;
          if (fx.kind === 'ring') {
            ctx.beginPath();
            ctx.arc(fx.x, fx.y, fx.r0 + (fx.r1 - fx.r0) * k, 0, TAU);
            ctx.strokeStyle = fx.color;
            ctx.lineWidth = 3;
            ctx.stroke();
          } else {
            ctx.font = '600 13px system-ui, sans-serif';
            ctx.fillStyle = fx.color;
            ctx.fillText(fx.text, fx.x, fx.y - k * 22);
          }
        }
        ctx.globalAlpha = 1;

        if (s.banner) {
          ctx.globalAlpha = Math.min(1, s.banner.t / 0.4);
          ctx.font = '600 18px system-ui, sans-serif';
          const bw = ctx.measureText(s.banner.text).width + 36;
          const bh = 38;
          roundRect(ctx, (W - bw) / 2, 14, bw, bh, 9);
          ctx.fillStyle = 'rgba(15, 18, 26, 0.85)';
          ctx.fill();
          ctx.fillStyle = '#f5b942';
          ctx.fillText(s.banner.text, W / 2, 14 + bh / 2);
          ctx.globalAlpha = 1;
        }

        if (s.paused && !s.over) {
          ctx.fillStyle = 'rgba(10, 12, 18, 0.55)';
          ctx.fillRect(0, 0, W, H);
          ctx.font = '700 36px system-ui, sans-serif';
          ctx.fillStyle = '#e8ecf4';
          ctx.fillText('Paused', W / 2, H / 2);
        }
      }

      // ---------- HUD & info panel ----------
      const hudCache = {};
      function setIfChanged(key, node, prop, value) {
        if (hudCache[key] === value) return;
        hudCache[key] = value;
        node[prop] = value;
      }

      function updateHud() {
        const s = state;
        setIfChanged('gold', el.gold, 'textContent', String(s.gold));
        setIfChanged('lives', el.lives, 'textContent', String(Math.max(0, s.lives)));
        setIfChanged('wave', el.wave, 'textContent', String(s.wave));
        setIfChanged('enemies', el.enemies, 'textContent', String(s.spawnQueue.length + s.enemies.length));
        setIfChanged('startDisabled', el.start, 'disabled', s.waveActive || s.over);
        setIfChanged('startLabel', el.start, 'textContent',
          s.waveActive ? `Wave ${s.wave} in progress` : `Start Wave ${s.wave + 1}`);
        setIfChanged('pauseLabel', el.pause, 'textContent', s.paused ? 'Resume' : 'Pause');
        setIfChanged('pauseDisabled', el.pause, 'disabled', s.over);
        setIfChanged('speedLabel', el.speed, 'textContent', `Speed ${SPEEDS[s.speedIndex]}×`);
        for (const [type, btn] of Object.entries(shopButtons)) {
          const poor = s.gold < TOWERS[type].cost;
          if (btn.classList.contains('poor') !== poor) btn.classList.toggle('poor', poor);
        }
      }

      function updateShopSelection() {
        for (const [type, btn] of Object.entries(shopButtons)) {
          btn.classList.toggle('selected', state.buildType === type);
        }
      }

      function renderInfo() {
        const s = state;
        el.info.replaceChildren();

        if (s.selectedTower) {
          const t = s.selectedTower;
          const def = TOWERS[t.type];
          const text = document.createElement('div');
          const parts = [
            `Damage ${def.damage}${def.splash ? ' (splash)' : ''}`,
            `Range ${def.range}`,
            `${(1 / def.rate).toFixed(1)} shots/s`,
          ];
          if (def.slow) parts.push(`Slows ${Math.round((1 - def.slow) * 100)}% for ${def.slowTime}s`);
          const title = document.createElement('strong');
          title.style.color = def.color;
          title.textContent = `${def.name} tower`;
          text.append(title, ` · ${parts.join(' · ')}`);

          const sell = document.createElement('button');
          sell.textContent = `Sell (+${sellValue(t)}g)`;
          sell.addEventListener('click', () => sellTower(t));
          el.info.append(text, sell);
          return;
        }

        const text = document.createElement('div');
        if (s.buildType) {
          const def = TOWERS[s.buildType];
          const title = document.createElement('strong');
          title.style.color = def.color;
          title.textContent = `Building ${def.name} (${def.cost}g)`;
          const hint = document.createElement('span');
          hint.className = 'muted';
          hint.textContent = ' — click a grass tile to place it. Right-click or Esc to stop building.';
          text.append(title, hint);
        } else {
          text.className = 'muted';
          text.textContent = s.over
            ? 'Game over. Press "Play again" to start a new run.'
            : 'Pick a tower below, then click a grass tile to build it. Click a tower to inspect or sell it. Start the wave when ready.';
        }
        el.info.append(text);
      }

      // ---------- Actions ----------
      function selectBuildType(type) {
        const s = state;
        if (s.over) return;
        s.buildType = s.buildType === type ? null : type;
        s.selectedTower = null;
        updateShopSelection();
        renderInfo();
      }

      function clearSelection() {
        state.buildType = null;
        state.selectedTower = null;
        updateShopSelection();
        renderInfo();
      }

      function tryBuild(c, r) {
        const s = state;
        const def = TOWERS[s.buildType];
        const { x, y } = tileCenter(c, r);
        if (!canBuildAt(c, r)) {
          addText(x, y - 14, "Can't build here", '#ef5b5b');
          return;
        }
        if (s.gold < def.cost) {
          addText(x, y - 14, 'Not enough gold', '#ef5b5b');
          return;
        }
        s.gold -= def.cost;
        s.towers.push({ type: s.buildType, c, r, x, y, angle: -Math.PI / 2, cooldown: 0 });
        addRing(x, y, 8, 26, def.color);
        updateHud();
      }

      function sellTower(t) {
        const s = state;
        if (s.over || !s.towers.includes(t)) return;
        const value = sellValue(t);
        s.gold += value;
        s.towers = s.towers.filter((other) => other !== t);
        addText(t.x, t.y - 14, `+${value}`, '#f5b942');
        if (s.selectedTower === t) s.selectedTower = null;
        renderInfo();
        updateHud();
      }

      function togglePause() {
        if (state.over) return;
        state.paused = !state.paused;
        updateHud();
      }

      function cycleSpeed() {
        state.speedIndex = (state.speedIndex + 1) % SPEEDS.length;
        updateHud();
      }

      function handleTileClick(c, r) {
        const s = state;
        if (s.over || !inBounds(c, r)) return;

        const tower = towerAt(c, r);
        if (tower) {
          s.selectedTower = s.selectedTower === tower ? null : tower;
          s.buildType = null;
          updateShopSelection();
          renderInfo();
          return;
        }

        if (s.buildType) {
          tryBuild(c, r);
          return;
        }

        if (s.selectedTower) {
          s.selectedTower = null;
          renderInfo();
        }
      }

      // ---------- Input ----------
      function eventTile(e) {
        const rect = canvas.getBoundingClientRect();
        const x = ((e.clientX - rect.left - canvas.clientLeft) / canvas.clientWidth) * W;
        const y = ((e.clientY - rect.top - canvas.clientTop) / canvas.clientHeight) * H;
        return { c: Math.floor(x / TILE), r: Math.floor(y / TILE) };
      }

      canvas.addEventListener('pointermove', (e) => {
        const tile = eventTile(e);
        state.hover = inBounds(tile.c, tile.r) ? tile : null;
        const overTower = state.hover && towerAt(tile.c, tile.r);
        canvas.style.cursor = overTower ? 'pointer' : state.buildType ? 'crosshair' : 'default';
      });

      canvas.addEventListener('pointerleave', () => {
        state.hover = null;
      });

      canvas.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        const tile = eventTile(e);
        state.hover = inBounds(tile.c, tile.r) ? tile : null;
        handleTileClick(tile.c, tile.r);
      });

      canvas.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        clearSelection();
      });

      el.start.addEventListener('click', startWave);
      el.pause.addEventListener('click', togglePause);
      el.speed.addEventListener('click', cycleSpeed);
      el.restart.addEventListener('click', newGame);

      window.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        // Let a focused button handle its own Space/Enter activation.
        if (e.target instanceof HTMLButtonElement && (e.key === ' ' || e.key === 'Enter')) return;

        const key = e.key.toLowerCase();
        const type = Object.keys(TOWERS).find((t) => TOWERS[t].key === key);
        if (type) {
          selectBuildType(type);
          return;
        }

        switch (key) {
          case ' ':
            e.preventDefault();
            startWave();
            break;
          case 'p':
            togglePause();
            break;
          case 'f':
            cycleSpeed();
            break;
          case 'escape':
            clearSelection();
            break;
          case 'delete':
          case 'backspace':
            if (state.selectedTower) {
              e.preventDefault();
              sellTower(state.selectedTower);
            }
            break;
        }
      });

      // ---------- Main loop ----------
      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        if (!state.paused && !state.over) {
          const steps = SPEEDS[state.speedIndex];
          for (let i = 0; i < steps && !state.over; i++) update(dt);
        }
        render();
        updateHud();
        requestAnimationFrame(frame);
      }

      newGame();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
