<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#11151c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bedrock Studio</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app" id="app" data-view="agents">
  <header class="topbar">
    <button class="brand" id="btn-projects" aria-label="Projects">
      <img src="/icon.svg" alt="" width="26" height="26">
      <span class="brand-text"><strong id="project-name">Bedrock Studio</strong><small id="project-meta">Pick a project</small></span>
      <span class="chev" aria-hidden="true">▾</span>
    </button>
    <div class="topbar-actions">
      <span class="run-dot" id="run-dot" title="Agent working" hidden></span>
      <button class="icon-btn" id="btn-settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main class="panes">
    <section class="pane" id="view-files" aria-label="Files">
      <div class="pane-head">
        <h2>Files</h2>
        <div class="row">
          <button class="icon-btn sm" id="btn-search" aria-label="Search files">⌕</button>
          <button class="icon-btn sm" id="btn-new-file" aria-label="New file">＋</button>
          <button class="icon-btn sm" id="btn-refresh" aria-label="Refresh">↻</button>
        </div>
      </div>
      <form class="search" id="search-form" hidden>
        <input id="search-input" placeholder="Search in project…" autocomplete="off" aria-label="Search text">
      </form>
      <div class="tree" id="tree"></div>
    </section>

    <section class="pane" id="view-editor" aria-label="Editor">
      <div class="pane-head editor-head">
        <div class="file-title"><span id="file-dirty" class="dirty" hidden>●</span><span id="file-path">No file open</span></div>
        <div class="row">
          <button class="btn sm ghost" id="btn-format" hidden>Format</button>
          <button class="btn sm ghost" id="btn-ask" hidden>Ask agent</button>
          <button class="btn sm primary" id="btn-save" disabled>Save</button>
        </div>
      </div>
      <div class="banner" id="editor-banner" hidden></div>
      <div class="editor-wrap" id="editor-wrap">
        <div class="empty" id="editor-empty">
          <p>Open a file from <b>Files</b>, or ask an agent to build something.</p>
        </div>
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" hidden aria-label="File contents"></textarea>
        <div class="image-view" id="image-view" hidden></div>
      </div>
      <div class="status-line" id="status-line"></div>
      <div class="keybar" id="keybar" hidden></div>
    </section>

    <section class="pane" id="view-agents" aria-label="Agents">
      <div class="pane-head agents-head">
        <div class="agent-chips" id="agent-chips" role="tablist"></div>
        <div class="row">
          <button class="icon-btn sm" id="btn-history" aria-label="Chat history">☰</button>
          <button class="icon-btn sm" id="btn-new-chat" aria-label="New chat">✚</button>
        </div>
      </div>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div class="suggestions" id="suggestions"></div>
      <form class="composer" id="composer">
        <textarea id="prompt" rows="1" placeholder="Describe what to build…" aria-label="Message"></textarea>
        <button class="send" id="btn-send" type="submit" aria-label="Send">➤</button>
      </form>
      <div class="meter" id="meter"></div>
    </section>

    <section class="pane" id="view-ship" aria-label="Build and publish">
      <div class="pane-head"><h2>Build &amp; publish</h2></div>
      <div class="ship" id="ship"></div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-view="files"><span>🗂</span>Files</button>
    <button data-view="editor"><span>✎</span>Code</button>
    <button data-view="agents"><span>✦</span>Agents</button>
    <button data-view="ship"><span>⬇</span>Build</button>
  </nav>
</div>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
