<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower Defense v0.1.0</title>
<style>
  :root { --bg:#1b1f2a; --panel:#262c3b; --text:#e8ecf4; --muted:#9aa4b8; --accent:#5fb3ff; --danger:#ff6b6b; --good:#6bdc8b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { margin:0 0 8px; font-size:1.4rem; }
  h1 small { color:var(--muted); font-weight:normal; font-size:.8rem; }
  #hud { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; background:var(--panel);
         padding:8px 14px; border-radius:8px; margin-bottom:8px; }
  #hud span b { color:var(--accent); }
  canvas { background:#2f6b3a; border-radius:8px; max-width:100%; cursor:crosshair; touch-action:none; }
  #controls { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  button { background:var(--accent); color:#0b1020; border:0; padding:8px 14px; border-radius:6px;
           font-weight:600; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  button.sel { outline:3px solid #fff; }
  #msg { margin-top:8px; color:var(--muted); min-height:1.2em; text-align:center; }
</style>
</head>
<body>
<h1>Tower Defense <small>v0.1.0</small></h1>
<div id="hud">
  <span>Lives: <b id="lives">20</b></span>
  <span>Gold: <b id="gold">100</b></span>
  <span>Wave: <b id="wave">0</b></span>
</div>
<canvas id="game" width="640" height="400"></canvas>
<div id="controls">
  <button id="t-basic" class="sel">Basic tower (50g)</button>
  <button id="t-sniper">Sniper tower (80g)</button>
  <button id="startWave">Start wave</button>
  <button id="restart">Restart</button>
</div>
<div id="msg">Click the grass to place a tower. Right-click a tower to sell it (50% refund).</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const TILE = 40, COLS = 16, ROWS = 10;

  // Path as grid waypoints
  const waypoints = [[0,2],[5,2],[5,7],[10,7],[10,3],[13,3],[13,8],[15,8],[16,8]];
  const path = waypoints.map(([c,r]) => ({ x: c*TILE + TILE/2, y: r*TILE + TILE/2 }));
  path[0].x = -TILE/2; path[path.length-1].x = COLS*TILE + TILE/2;

  // Mark path tiles as unbuildable
  const pathTiles = new Set();
  for (let i = 0; i < waypoints.length - 1; i++) {
    let [c1,r1] = waypoints[i], [c2,r2] = waypoints[i+1];
    const dc = Math.sign(c2-c1), dr = Math.sign(r2-r1);
    while (c1 !== c2 || r1 !== r2) { pathTiles.add(c1+','+r1); c1 += dc; r1 += dr; }
    pathTiles.add(c2+','+r2);
  }

  const TOWERS = {
    basic:  { cost:50, range:100, damage:10, rate:0.5, color:'#5fb3ff', bullet:'#cfe8ff' },
    sniper: { cost:80, range:180, damage:35, rate:1.5, color:'#c38bff', bullet:'#f0dcff' },
  };

  let state;
  function reset() {
    state = { lives:20, gold:100, wave:0, towers:[], enemies:[], bullets:[],
              spawnQueue:0, spawnTimer:0, waveActive:false, over:false, selected:'basic' };
    selectTower('basic');
    setMsg('Click the grass to place a tower. Right-click a tower to sell it (50% refund).');
    updateHud();
  }

  const $ = id => document.getElementById(id);
  function setMsg(t) { $('msg').textContent = t; }
  function updateHud() {
    $('lives').textContent = state.lives; $('gold').textContent = state.gold; $('wave').textContent = state.wave;
    $('startWave').disabled = state.waveActive || state.over;
  }
  function selectTower(type) {
    state.selected = type;
    $('t-basic').classList.toggle('sel', type === 'basic');
    $('t-sniper').classList.toggle('sel', type === 'sniper');
  }

  function startWave() {
    if (state.waveActive || state.over) return;
    state.wave++;
    state.spawnQueue = 5 + state.wave * 2;
    state.spawnTimer = 0;
    state.waveActive = true;
    setMsg('Wave ' + state.wave + ' incoming!');
    updateHud();
  }

  function spawnEnemy() {
    const hp = 20 + state.wave * 12;
    state.enemies.push({ x:path[0].x, y:path[0].y, seg:0, hp, maxHp:hp,
                         speed: 50 + state.wave * 3, reward: 5 + Math.floor(state.wave/2) });
  }

  function canvasPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x:(e.clientX - r.left) * canvas.width / r.width, y:(e.clientY - r.top) * canvas.height / r.height };
  }

  canvas.addEventListener('click', e => {
    if (state.over) return;
    const p = canvasPos(e), c = Math.floor(p.x/TILE), r = Math.floor(p.y/TILE);
    if (pathTiles.has(c+','+r)) return setMsg("Can't build on the path.");
    if (state.towers.some(t => t.c === c && t.r === r)) return setMsg('Tile already occupied.');
    const def = TOWERS[state.selected];
    if (state.gold < def.cost) return setMsg('Not enough gold.');
    state.gold -= def.cost;
    state.towers.push({ c, r, x:c*TILE+TILE/2, y:r*TILE+TILE/2, type:state.selected, cooldown:0, angle:0 });
    updateHud();
  });

  canvas.addEventListener('contextmenu', e => {
    e.preventDefault();
    const p = canvasPos(e), c = Math.floor(p.x/TILE), r = Math.floor(p.y/TILE);
    const i = state.towers.findIndex(t => t.c === c && t.r === r);
    if (i >= 0) {
      state.gold += Math.floor(TOWERS[state.towers[i].type].cost / 2);
      state.towers.splice(i, 1);
      updateHud();
    }
  });

  let hover = null;
  canvas.addEventListener('mousemove', e => {
    const p = canvasPos(e); hover = { c:Math.floor(p.x/TILE), r:Math.floor(p.y/TILE) };
  });
  canvas.addEventListener('mouseleave', () => hover = null);

  $('t-basic').onclick = () => selectTower('basic');
  $('t-sniper').onclick = () => selectTower('sniper');
  $('startWave').onclick = startWave;
  $('restart').onclick = reset;

  function update(dt) {
    if (state.over) return;

    // Spawning
    if (state.spawnQueue > 0) {
      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) { spawnEnemy(); state.spawnQueue--; state.spawnTimer = 0.8; }
    }

    // Enemies move along path
    for (const en of state.enemies) {
      let move = en.speed * dt;
      while (move > 0 && en.seg < path.length - 1) {
        const t = path[en.seg+1], dx = t.x - en.x, dy = t.y - en.y, d = Math.hypot(dx, dy);
        if (d <= move) { en.x = t.x; en.y = t.y; en.seg++; move -= d; }
        else { en.x += dx/d*move; en.y += dy/d*move; move = 0; }
      }
      if (en.seg >= path.length - 1) { en.escaped = true; state.lives--; }
    }

    // Towers fire at the enemy furthest along within range
    for (const t of state.towers) {
      const def = TOWERS[t.type];
      t.cooldown -= dt;
      let target = null;
      for (const en of state.enemies) {
        if (en.hp > 0 && !en.escaped && Math.hypot(en.x-t.x, en.y-t.y) <= def.range &&
            (!target || en.seg > target.seg)) target = en;
      }
      if (target) {
        t.angle = Math.atan2(target.y - t.y, target.x - t.x);
        if (t.cooldown <= 0) {
          state.bullets.push({ x:t.x, y:t.y, target, damage:def.damage, color:def.bullet, speed:400 });
          t.cooldown = def.rate;
        }
      }
    }

    // Bullets home in on target
    for (const b of state.bullets) {
      const dx = b.target.x - b.x, dy = b.target.y - b.y, d = Math.hypot(dx, dy), step = b.speed * dt;
      if (d <= step) {
        b.done = true;
        if (b.target.hp > 0) {
          b.target.hp -= b.damage;
          if (b.target.hp <= 0) state.gold += b.target.reward;
        }
      } else { b.x += dx/d*step; b.y += dy/d*step; }
      if (b.target.escaped) b.done = true;
    }

    state.bullets = state.bullets.filter(b => !b.done);
    state.enemies = state.enemies.filter(e => e.hp > 0 && !e.escaped);

    if (state.lives <= 0) {
      state.lives = 0; state.over = true; state.waveActive = false;
      setMsg('Game over! You survived ' + (state.wave - 1) + ' waves. Press Restart.');
    } else if (state.waveActive && state.spawnQueue === 0 && state.enemies.length === 0) {
      state.waveActive = false;
      const bonus = 20 + state.wave * 5;
      state.gold += bonus;
      setMsg('Wave ' + state.wave + ' cleared! +' + bonus + ' gold bonus.');
    }
    updateHud();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grass grid
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      ctx.fillStyle = pathTiles.has(c+','+r) ? '#b08a5a' : ((c + r) % 2 ? '#2f6b3a' : '#347441');
      ctx.fillRect(c*TILE, r*TILE, TILE, TILE);
    }

    // Hover preview
    if (hover && !state.over) {
      const ok = !pathTiles.has(hover.c+','+hover.r) && !state.towers.some(t => t.c===hover.c && t.r===hover.r)
                 && state.gold >= TOWERS[state.selected].cost;
      ctx.fillStyle = ok ? 'rgba(255,255,255,.25)' : 'rgba(255,80,80,.3)';
      ctx.fillRect(hover.c*TILE, hover.r*TILE, TILE, TILE);
      if (ok) {
        ctx.strokeStyle = 'rgba(255,255,255,.4)';
        ctx.beginPath(); ctx.arc(hover.c*TILE+TILE/2, hover.r*TILE+TILE/2, TOWERS[state.selected].range, 0, Math.PI*2); ctx.stroke();
      }
    }

    // Towers
    for (const t of state.towers) {
      const def = TOWERS[t.type];
      ctx.fillStyle = '#444b5c'; ctx.fillRect(t.x-15, t.y-15, 30, 30);
      ctx.fillStyle = def.color; ctx.beginPath(); ctx.arc(t.x, t.y, 11, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = def.color; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(t.x + Math.cos(t.angle)*18, t.y + Math.sin(t.angle)*18); ctx.stroke();
      ctx.lineWidth = 1;
    }

    // Enemies
    for (const en of state.enemies) {
      ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.arc(en.x, en.y, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.fillRect(en.x-14, en.y-20, 28, 4);
      ctx.fillStyle = '#6bdc8b'; ctx.fillRect(en.x-14, en.y-20, 28 * Math.max(0, en.hp/en.maxHp), 4);
    }

    // Bullets
    for (const b of state.bullets) {
      ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
    }

    if (state.over) {
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 40px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
    }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
